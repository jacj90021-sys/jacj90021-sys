plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cmaster.cloner'
    compileSdk 37

    defaultConfig {
        applicationId "com.cmaster.cloner"
        minSdk 32
        targetSdk 35
        versionCode 20080
        versionName "2.8.0.10"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
